; Production Unreal six-car garage customization. These three F-keys
; are menu-only; GameMode rejects them outside the Garage page.
+ActionMappings=(ActionName="GarageCyclePaint",Key=F5)
+ActionMappings=(ActionName="GarageCycleStripe",Key=F6)
+ActionMappings=(ActionName="GarageCycleWheels",Key=F7)

; Gamepad garage-only cosmetic shortcuts while the menu is paused.
; These buttons already drive normal gameplay actions outside the menu;
; only cosmetic callbacks execute when paused, and GameMode rejects any
; request outside the Garage page. Closing the menu clears stale inputs.
+ActionMappings=(ActionName="GarageCyclePaint",Key=Gamepad_RightThumbstick)
+ActionMappings=(ActionName="GarageCycleStripe",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="GarageCycleWheels",Key=Gamepad_LeftShoulder)

; Return only the selected car's visual layers to factory defaults.
+ActionMappings=(ActionName="GarageResetLook",Key=F8)

; Read-only gallery browsing: unlike E, this never equips a locked car.
; RShoulder and right-face are reserved for camera/recovery while driving;
; the browse callback is pause-capable but GameMode accepts it only in Garage.
+ActionMappings=(ActionName="GarageBrowseNext",Key=F9)
+ActionMappings=(ActionName="GarageBrowsePrevious",Key=F10)
+ActionMappings=(ActionName="GarageBrowseNext",Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="GarageBrowsePrevious",Key=Gamepad_FaceButton_Right)

; Production Unreal starter-circuit lighting evaluation, Settings page only.
; Reversible per-session visual preview; no SaveGame schema or race effect.
+ActionMappings=(ActionName="CircuitLightingPreview",Key=F3)

; Dedicated paused Garage camera angle. C/RB still select driving views
; outside the menu; F4 never changes the saved racing camera preference.
+ActionMappings=(ActionName="GarageOrbit",Key=F4)

; Experimental finished-results replay only; never a driving action.
+ActionMappings=(ActionName="FleetReplayPrevious",Key=J)
+ActionMappings=(ActionName="FleetReplayPlayPause",Key=K)
+ActionMappings=(ActionName="FleetReplayNext",Key=L)
+ActionMappings=(ActionName="FleetReplayHighlight",Key=H)

; Session-only telemetry density, accepted on Settings only.
+ActionMappings=(ActionName="CycleHudTelemetry",Key=F2)
