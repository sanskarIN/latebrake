name: Publish v0.3.0 garage source pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.0-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0.3.0-source-preview
  cancel-in-progress: false

jobs:
  tests:
    name: Test portable C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 tests
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile source tests
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Execute racing, AI and rewards tests
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  publish:
    name: Publish clearly labeled SOURCE-ONLY pre-release
    needs: [tests]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish source revision as v0.3.0 pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'v0.3.0';
            const sha = context.sha;
            const expectedParent = 'v0.2.1';
            await github.rest.repos.getReleaseByTag({owner, repo, tag: expectedParent});
            const notes = [
              '## Latebrake v0.3.0 — source-only development pre-release',
              '',
              '**NOT a playable Windows or Android game package. No tested EXE, APK or AAB is provided.**',
              'GitHub auto-generated source archives contain uncompiled Unreal Engine C++ source. Unreal 5.8 editor/UHT builds, platform cooking, actual physics, save serialization and device testing remain outstanding.',
              '',
              '### Added in this source milestone',
              '- Three original fictional tuning profiles: Arrow, Kestrel and Phantom, with engine primitive-only starter silhouettes.',
              '- Offline vehicle unlocks costing 600/1200 earned in-game race credits.',
              '- Three-level engine and grip upgrades; bounded credit balances and purchase validation.',
              '- Versioned SaveGame property additions for garage ownership, selected profile and tuning levels, with safe fallback when older slots omit fields.',
              '- Applied player-only acceleration/grip/top-speed multipliers; AI rivals keep their default handling.',
              '- Prototype Q/E/U/I garage shortcuts and HUD price, vehicle and upgrade information.',
              '- Standalone C++20 garage tests covering purchases, corrupt save fields, overflow and performance multipliers.',
              '',
              '### Verification',
              '- This release workflow runs portable CMake/CTest on Windows, Ubuntu and macOS against the exact tagged merged source before publication.',
              '- A passing CTest does NOT certify Unreal Engine game compilation, real gameplay, mobile controls or the garage user experience.',
              '',
              '### Still required',
              '- Unreal Engine 5.8 game/editor build and actual Win64/Android packages, original finished 3D vehicles, Chaos tire/suspension, and in-engine save migration tests.',
              '- Stable v1.0.0 remains blocked by the issue: https://github.com/sanskarIN/latebrake/issues/2',
              'Read docs/GARAGE.md and docs/releases/v0.3.0.md for the full scope.',
              'Original authored source BSD-3-Clause; Unreal Engine is subject to separate Epic terms.'
            ].join('\n');

            let tagRef;
            try {
              const existingTag = await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag});
              tagRef = existingTag.data.object;
              if (tagRef.type !== 'commit' || tagRef.sha !== sha) {
                throw new Error('Tag already exists at a different revision: refusing to retag.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha});
              core.info('Created ' + tag + ' at ' + sha);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: sha,
                name: 'Latebrake v0.3.0 — Garage & Vehicle Tuning (Source Pre-release)',
                body: notes,
                draft: false,
                prerelease: true,
                make_latest: 'false',
                generate_release_notes: false
              })).data;
            }
            if (release.draft || !release.prerelease || release.tag_name !== tag) {
              throw new Error('v0.3.0 must be published as a non-draft source-only pre-release.');
            }
            core.notice('Published/verified: ' + release.html_url + ' @ ' + sha);
