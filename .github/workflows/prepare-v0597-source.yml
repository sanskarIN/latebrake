name: Publish prepared v0.5.97 SOURCE-ONLY prerelease (manual)

# Preparation/merge never publishes. The owner must explicitly dispatch from
# protected main; each dispatch independently requalifies the immutable source.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0597-experimental-source-only
  cancel-in-progress: false

env:
  RELEASE_COMMIT: 65ef6f2f192081b64f8256867403f40882cca462

jobs:
  preflight:
    name: Authenticate source identity and offline release guards
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main' && github.actor == 'sanskarIN'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify publisher state-machine guards without network or writes
        run: node --test Tests/Release/ExperimentalSourceReleaseTests.cjs
      - name: Authenticate exact draft source and notes BEFORE candidate checkout
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const guard = require('./scripts/ExperimentalSourceRelease.cjs');
            const plan = require('./scripts/releases/v0.5.97.json');
            if (plan.sourceSha !== process.env.RELEASE_COMMIT) throw Error('Plan/source pin mismatch');
            const notes = fs.readFileSync(plan.notesPath, 'utf8');
            await guard.inspectState({github, context, plan, notes});

  source-tests:
    name: Exact-source C++20 / ${{ matrix.os }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65ef6f2f192081b64f8256867403f40882cca462
          persist-credentials: false
      - name: Verify immutable candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Tests/Standalone/build --config Release --parallel 4
      - run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure
      - name: Require the actual suspension and road-brake targets
        shell: bash
        run: |
          for target in SprungChassisDynamics SprungChassisRideHeight AxleTractionBudget SuspensionRayVelocity SprungContactBraking BrakeRoadTangent; do
            ctest --test-dir Tests/Standalone/build -C Release -R "^$target$" --no-tests=error --output-on-failure || exit 1
          done

  editor-tests:
    name: Python source contracts and production counts (NOT Unreal)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65ef6f2f192081b64f8256867403f40882cca462
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v
      - name: Report production quantity without pretending v0.6.0 is qualified
        run: python3 scripts/MeasureSourceScale.py --json

  packaging-policy:
    name: PowerShell syntax and synthetic packaging (NO game build)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65ef6f2f192081b64f8256867403f40882cca462
          persist-credentials: false
      - shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_COMMIT) { throw 'Source mismatch' }
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Invalid syntax in $($script.Name)" }
          }
          & ./scripts/Test-PackagingPolicy.ps1
          if (-not $?) { throw 'Packaging policy failed' }
          & ./scripts/Test-SourceProvenancePolicy.ps1
          if (-not $?) { throw 'Provenance policy failed' }
          & ./scripts/Test-WindowsPlaytestWrapperPolicy.ps1
          if (-not $?) { throw 'Win64 wrapper policy failed' }
          & ./scripts/Test-WindowsRuntimePlaytestPolicy.ps1
          if (-not $?) { throw 'Runtime candidate policy failed' }

  documentation:
    name: Build and verify exact source documentation
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65ef6f2f192081b64f8256867403f40882cca462
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: python -m pip install --requirement docs-requirements.txt
      - run: python -m mkdocs build --clean
      - run: python scripts/verify_docs_site.py site

  source-prerelease:
    name: Publish immutable v0.5.97 with zero attached assets
    needs: [preflight, source-tests, editor-tests, packaging-policy, documentation]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main' && github.actor == 'sanskarIN'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Only trusted main code runs with write scope. Never checkout the PR
      # here, download a candidate artifact or execute candidate scripts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const guard = require('./scripts/ExperimentalSourceRelease.cjs');
            const plan = require('./scripts/releases/v0.5.97.json');
            if (plan.sourceSha !== process.env.RELEASE_COMMIT) throw Error('Plan/source pin mismatch');
            const notes = fs.readFileSync(plan.notesPath, 'utf8');
            const release = await guard.publish({github, context, plan, notes});
            core.notice('Verified SOURCE-ONLY prerelease: ' + release.html_url + ' @ ' + plan.sourceSha);
