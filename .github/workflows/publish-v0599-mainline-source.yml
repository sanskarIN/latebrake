name: Publish approved v0.5.99 mainline SOURCE-ONLY pre-release

# Explicitly approved one-version source publication. The one-shot push
# requires the owner's exact squash-merge subject; owner may also manually
# dispatch on protected main. Never run untrusted PR code with write token.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0599-mainline-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0599-one-shot-source-publisher
  cancel-in-progress: false

jobs:
  preflight:
    name: Authenticate protected main and immutable previous source release
    if: >-
      github.repository == 'sanskarIN/latebrake' &&
      github.actor == 'sanskarIN' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message,
          'release(v0.5.99): approved source-only mainline snapshot')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test all offline guard state transitions (NO writes)
        run: |
          node --test Tests/Release/ExperimentalSourceReleaseTests.cjs
          node --test Tests/Release/MainlineSourceReleaseV0599Tests.cjs
      - name: Read-only verify exact source notes, main and predecessor
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const guard = require('./scripts/MainlineSourceReleaseV0599.cjs');
            const notes = fs.readFileSync(guard.NOTES_PATH,'utf8');
            await guard.inspectState({github, context, notes});
            core.notice('v0.5.99 protected mainline source-only plan authenticated.');

  cpp:
    name: Strict portable C++20 / ${{ matrix.os }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact candidate source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Tests/Standalone/build --config Release --parallel 4
      - run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure
      - name: Require actual physical draft/relative motion C++ target
        shell: bash
        run: ctest --test-dir Tests/Standalone/build -C Release -R '^SlipstreamDraftBoost$' --no-tests=error --output-on-failure

  editor:
    name: Python source contracts and measured C++ count (NOT Unreal)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v
      - run: python3 scripts/MeasureSourceScale.py --json

  policies:
    name: PowerShell syntax and fake-asset policy only (NO game build)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {
            throw 'Source SHA changed before packaging-policy checks'
          }
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell syntax invalid: $($script.Name)" }
          }
          & ./scripts/Test-PackagingPolicy.ps1
          if (-not $?) { throw 'Synthetic packaging policy failed' }
          & ./scripts/Test-SourceProvenancePolicy.ps1
          if (-not $?) { throw 'Source provenance policy failed' }
          & ./scripts/Test-WindowsPlaytestWrapperPolicy.ps1
          if (-not $?) { throw 'Win64 wrapper policy failed' }
          & ./scripts/Test-WindowsRuntimePlaytestPolicy.ps1
          if (-not $?) { throw 'Runtime playtest policy failed' }

  docs:
    name: Exact-source documentation build and site audit
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: python -m pip install --requirement docs-requirements.txt
      - run: python -m mkdocs build --clean
      - run: python scripts/verify_docs_site.py site

  publish:
    name: Publish exact tagged SOURCE-ONLY v0.5.99 (zero attachments)
    needs: [preflight, cpp, editor, policies, docs]
    if: >-
      github.repository == 'sanskarIN/latebrake' &&
      github.actor == 'sanskarIN' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message,
          'release(v0.5.99): approved source-only mainline snapshot')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The write-authorized job executes only protected main's fixed,
      # audited guard, NEVER candidate PR code or downloaded executables.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const guard = require('./scripts/MainlineSourceReleaseV0599.cjs');
            const notes = fs.readFileSync(guard.NOTES_PATH,'utf8');
            const release = await guard.publish({github,context,notes});
            core.notice('Published and read-back verified v0.5.99: '+release.html_url+
              ' @ '+context.sha+'; zero playable attachments');
