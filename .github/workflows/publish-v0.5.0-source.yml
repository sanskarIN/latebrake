name: Publish v0.5.0 career source pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.5.0-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0.5.0-source-preview
  cancel-in-progress: false

jobs:
  tests:
    name: Test portable C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 tests
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile source tests
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Execute complete portable C++20 race, track and touch tests
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  publish:
    name: Publish clearly labeled SOURCE-ONLY pre-release
    needs: [tests]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish source revision as v0.5.0 pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'v0.5.0';
            const sha = context.sha;
            const expectedParent = 'v0.4.1';
            await github.rest.repos.getReleaseByTag({owner, repo, tag: expectedParent});
            const notes = [
              "## LateBrake v0.5.0 — Career & Championship Foundations",
              "",
              "**SOURCE-ONLY GITHUB PRE-RELEASE; NOT A PLAYABLE GAME. No Win64 EXE, Android APK/AAB or Linux game binary is attached.**",
              "No licensed UE 5.8 Editor/UHT compilation, project-level cook, installed driving/playtesting, or Android hardware qualification has been performed.",
              "",
              "### Source implemented",
              "- Two original three-round offline championship series and six standalone challenges, all on the existing single prototype circuit.",
              "- Stable career event IDs, prerequisite unlocks, bronze/silver/gold objectives, cumulative medal points and one-time completion/series credit awards.",
              "- Race-progress integration, six-lap endurance support, validated player-only career result scoring, real save-model migration and garage economy integration.",
              "- Asset-free developmental ten-page menu source with keyboard, controller and experimental Android touch navigation plus persisted speed units.",
              "- Mobile app lifecycle input-neutralization hooks; corrected Unreal packaging helper and missing-map release preflight.",
              "- Strict standalone C++20 regression tests for catalog, championship/progression, challenge rules, menu navigation and previous racing functionality.",
              "",
              "### Scope of verification",
              "- Windows, Ubuntu and macOS runner CMake/CTest tests passed on the exact tagged source commit.",
              "- Portable test results DO NOT establish an Unreal build, functioning packaged UI, physics behavior, save serialization or Android lifecycle correctness.",
              "- No project-owned authored cookable .umap, tested EXE/APK/AAB, qualified binaries or synthetic placeholders are included.",
              "- See docs/releases/v0.5.0.md, docs/CAREER.md, docs/SAVE_MIGRATION.md and docs/STATUS.md.",
              "- Issues #2 and #13 remain open pending a real engine build and device test evidence.",
              "",
              "Original project code BSD-3-Clause; Unreal Engine separately licensed.",
            ].join('\n');

            let tagRef;
            try {
              const existingTag = await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag});
              tagRef = existingTag.data.object;
              if (tagRef.type !== 'commit' || tagRef.sha !== sha) {
                throw new Error('Tag already exists at a different revision: refusing to retag.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha});
              core.info('Created ' + tag + ' at ' + sha);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: sha,
                name: 'LateBrake v0.5.0 — Career & Championship Foundations (Source Pre-release)',
                body: notes,
                draft: false,
                prerelease: true,
                make_latest: 'false',
                generate_release_notes: false
              })).data;
            }
            if (release.draft || !release.prerelease || release.tag_name !== tag) {
              throw new Error('v0.5.0 must be published as a non-draft source-only pre-release.');
            }
            core.notice('Published/verified: ' + release.html_url + ' @ ' + sha);
