name: Publish v0.4.1 mobile-touch source pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.4.1-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0.4.1-source-preview
  cancel-in-progress: false

jobs:
  tests:
    name: Test portable C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 tests
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile source tests
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Execute complete portable C++20 race, track and touch tests
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  publish:
    name: Publish clearly labeled SOURCE-ONLY pre-release
    needs: [tests]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish source revision as v0.4.1 pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'v0.4.1';
            const sha = context.sha;
            const expectedParent = 'v0.4.0';
            await github.rest.repos.getReleaseByTag({owner, repo, tag: expectedParent});
            const notes = [
              "## Latebrake v0.4.1 — Android touch UX source-only pre-release",
              "",
              "**NOT A PLAYABLE GAME. No tested Win64 EXE, Android APK/AAB or Linux executable is attached.**",
              "This is an uncompiled Unreal Engine 5.8 source snapshot. An authorized Unreal editor/UHT build, phone/device testing and actual platform packaging remain outstanding.",
              "",
              "### Source additions",
              "- Shared portable C++20 touch layout for the Android HUD and touch input hit-testing.",
              "- Visible responsive steer, gas, brake, pause, restart and recover pads.",
              "- Two-finger steering/pedal capture, safe neutral gas/brake gap and rejection of invalid touch coordinates.",
              "- Touch pause/resume binding, restart-unpause behavior and a compact HUD.",
              "- Portable layout/geometry tests across Windows, Ubuntu and macOS.",
              "",
              "### Verification and limits",
              "- The exact tagged source revision is gated on full standalone CMake/CTest suites across all three CI operating systems.",
              "- CI cannot compile Unreal UCLASS code, render the HUD, validate touch lifecycle, package Android or perform real gameplay/hardware tests.",
              "- See docs/TOUCH_CONTROLS.md and docs/releases/v0.4.1.md for manual Android acceptance requirements.",
              "- Stable v1.0.0 remains blocked by genuine Unreal compilation, original cookable content, installed Win64/Android builds and end-to-end device QA (issue #2).",
              "",
              "Authored project source BSD-3-Clause; Unreal Engine separately licensed.",
            ].join('\n');

            let tagRef;
            try {
              const existingTag = await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag});
              tagRef = existingTag.data.object;
              if (tagRef.type !== 'commit' || tagRef.sha !== sha) {
                throw new Error('Tag already exists at a different revision: refusing to retag.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha});
              core.info('Created ' + tag + ' at ' + sha);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: sha,
                name: 'Latebrake v0.4.1 — Android Touch Controls (Source Pre-release)',
                body: notes,
                draft: false,
                prerelease: true,
                make_latest: 'false',
                generate_release_notes: false
              })).data;
            }
            if (release.draft || !release.prerelease || release.tag_name !== tag) {
              throw new Error('v0.4.1 must be published as a non-draft source-only pre-release.');
            }
            core.notice('Published/verified: ' + release.html_url + ' @ ' + sha);
