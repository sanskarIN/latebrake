name: Publish LateBrake v0.5.95 experimental SOURCE-ONLY prerelease

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-circuit-v0595-experimental.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0595-original-track-source-only
  cancel-in-progress: false

env:
  RELEASE_COMMIT: 45e62e2f9009741bf947019105708abe64f89c3f

jobs:
  preflight:
    name: Confirm immutable owner draft PR and release notes
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check source, PR owner and exact markdown byte identity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const sha = process.env.RELEASE_COMMIT;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid pinned candidate SHA');
            if (context.eventName !== 'push' && context.eventName !== 'workflow_dispatch') {
              throw Error('Disallowed publisher event');
            }
            const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if (main !== context.sha) throw Error('Publisher main changed');
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:313})).data;
            if (pr.state !== 'open' || !pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'feat/ue-physical-asphalt-surface-detail-20261107' ||
                pr.head.repo?.full_name !== 'sanskarIN/latebrake' ||
                pr.head.user?.login !== 'sanskarIN' || pr.head.sha !== sha) {
              throw Error('Candidate must be the exact owner-controlled open draft PR #313 head');
            }
            const notes = fs.readFileSync('docs/releases/v0.5.95.md', 'utf8');
            const candidateNotes = (await github.rest.repos.getContent({
              owner,repo,path:'docs/releases/v0.5.95.md',ref:sha
            })).data;
            if (candidateNotes.encoding !== 'base64' ||
                !Buffer.from(candidateNotes.content,'base64').equals(Buffer.from(notes,'utf8'))) {
              throw Error('Publisher notes differ from the pinned PR source bytes');
            }
            for (const marker of [
              'SOURCE-ONLY', 'NOT a playable game build', 'Win64 EXE',
              'Android APK/AAB', 'zero executable binaries', 'not installers',
              'unmerged development', 'material', 'rubber', 'UE5.8'
            ]) if (!notes.includes(marker)) {
              throw Error('Release description lacks explicit source/art warning '+marker);
            }
            const prev = (await github.rest.repos.getReleaseByTag({
              owner,repo,tag:'v0.5.94'
            })).data;
            if (prev.draft || !prev.prerelease || prev.assets.length !== 0 ||
                prev.tag_name !== 'v0.5.94') {
              throw Error('v0.5.94 source-only predecessor invalid');
            }
            core.notice('Authorized source-only candidate '+sha+' from PR #313');

  source-tests:
    name: Exact candidate C++20 CTest / ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45e62e2f9009741bf947019105708abe64f89c3f
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Tests/Standalone/build --config Release --parallel 4
      - run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure
      - name: Individually verify the actual 3D road-detail numerical plan
        shell: bash
        run: ctest --test-dir Tests/Standalone/build -C Release -R "^CircuitSurfaceDetail$" --no-tests=error --output-on-failure

  editor-tests:
    name: All portable editor bindings and no licensed Unreal build
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45e62e2f9009741bf947019105708abe64f89c3f
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py scripts/Unreal/CreateTrackMaterial.py
      - run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v

  packaging-policy:
    name: Source-only PowerShell source/asset and archive policies
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45e62e2f9009741bf947019105708abe64f89c3f
          persist-credentials: false
      - name: Refuse source or Unreal asset mislabeling
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_COMMIT) {
            throw 'Pinned source mismatch'
          }
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $($script.Name)" }
          }
          ./scripts/Test-PackagingPolicy.ps1
          if (-not $?) { throw 'Synthetic packaging policy failed' }
          ./scripts/Test-SourceProvenancePolicy.ps1
          if (-not $?) { throw 'Synthetic source-provenance policy failed' }
          ./scripts/Test-TrackMaterialSourcePolicy.ps1
          if (-not $?) { throw 'Synthetic material-provenance policy failed' }
          ./scripts/Test-CandidateManifestPolicy.ps1
          if (-not $?) { throw 'Synthetic candidate manifest policy failed' }

  documentation:
    name: Docs from exact source-only SHA
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45e62e2f9009741bf947019105708abe64f89c3f
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: python -m pip install --requirement docs-requirements.txt
      - run: python -m mkdocs build --clean
      - run: python scripts/verify_docs_site.py site

  source-prerelease:
    name: Publish immutable v0.5.95 SOURCE ONLY (no binaries)
    needs: [preflight, source-tests, editor-tests, packaging-policy, documentation]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check unchanged owner draft, tag and previous prerelease before publishing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const sha = process.env.RELEASE_COMMIT;
            const tag = 'v0.5.95';
            const notes = fs.readFileSync('docs/releases/v0.5.95.md','utf8');
            const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if (main !== context.sha) throw Error('Protected main moved during CI');
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:313})).data;
            if (pr.state !== 'open' || !pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'feat/ue-physical-asphalt-surface-detail-20261107' ||
                pr.head.repo?.full_name !== 'sanskarIN/latebrake' ||
                pr.head.user?.login !== 'sanskarIN' || pr.head.sha !== sha) {
              throw Error('Draft candidate no longer matches exact verified source head');
            }
            const src = (await github.rest.repos.getContent({
              owner,repo,path:'docs/releases/v0.5.95.md',ref:sha
            })).data;
            if (src.encoding !== 'base64' ||
                !Buffer.from(src.content,'base64').equals(Buffer.from(notes,'utf8'))) {
              throw Error('Source release-note bytes drifted');
            }
            const prev = (await github.rest.repos.getReleaseByTag({
              owner,repo,tag:'v0.5.94'
            })).data;
            if (prev.draft || !prev.prerelease || prev.assets.length !== 0 ||
                prev.tag_name !== 'v0.5.94') {
              throw Error('Previous source-only release unexpectedly changed');
            }
            let ref;
            try {
              ref = (await github.rest.git.getRef({owner,repo,ref:'tags/'+tag})).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref) {
              if (ref.type !== 'commit' || ref.sha !== sha) {
                throw Error('Refuse moving or recreating an unrelated immutable tag');
              }
            } else {
              await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+tag,sha});
            }
            let published;
            try {
              published = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!published) {
              published = (await github.rest.repos.createRelease({
                owner,repo,tag_name:tag,target_commitish:sha,
                name:'LateBrake v0.5.95 — Original Circuit Art Foundation (SOURCE-ONLY Pre-release)',
                body:notes,draft:false,prerelease:true,
                generate_release_notes:false,make_latest:'false'
              })).data;
            }
            if (published.draft || !published.prerelease ||
                published.tag_name !== tag || published.body !== notes ||
                published.assets.length !== 0 || published.target_commitish !== sha) {
              throw Error('Published source-only release does not match exact expected tag or notes');
            }
            core.notice('Published truthful source-only v0.5.95: '+published.html_url+' @ '+sha);
