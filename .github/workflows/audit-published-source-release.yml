name: Audit published source-only GitHub release (READ-ONLY)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published source-only tag to verify (e.g. v0.5.85)'
        required: true
        type: string

# Metadata verification only: not a playable-game build or a
# replacement for the actual publishing qualification jobs.
permissions:
  contents: read

jobs:
  audit-source-release:
    name: Verify tag, exact source notes and zero game attachments
    if: github.repository == 'sanskarIN/latebrake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit immutable published snapshot using GitHub API
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.eventName === 'release'
              ? context.payload.release?.tag_name
              : process.env.INPUT_TAG;
            if (!/^v0\.5\.\d+$/.test(tag || '')) {
              throw new Error('Only an explicit v0.5.N source-preview tag is accepted.');
            }

            // Read-only lookup. An ambiguous publisher HTTP 500
            // is neither proof of publication nor proof of failure.
            const release = (await github.rest.repos.getReleaseByTag({
              owner, repo, tag
            })).data;
            if (release.tag_name !== tag || release.draft ||
                !release.prerelease || !release.published_at ||
                release.assets.length !== 0) {
              throw new Error('Release absent, draft, not a pre-release, or has game assets.');
            }

            const ref = (await github.rest.git.getRef({
              owner, repo, ref: 'tags/' + tag
            })).data.object;
            if (ref.type !== 'commit' ||
                !/^[a-f0-9]{40}$/.test(ref.sha)) {
              throw new Error('Source tag is not a direct 40-digit commit ref.');
            }
            if (release.target_commitish !== ref.sha) {
              throw new Error('Release target commit does not match its source tag.');
            }

            // Compare the exact immutable source-tag notes, not moving main.
            const noteFile = (await github.rest.repos.getContent({
              owner, repo,
              path: 'docs/releases/' + tag + '.md',
              ref: ref.sha
            })).data;
            if (Array.isArray(noteFile) || noteFile.type !== 'file' ||
                noteFile.encoding !== 'base64' ||
                typeof noteFile.content !== 'string') {
              throw new Error('Source-tagged release notes are not a regular file.');
            }
            const notes = Buffer.from(
              noteFile.content.replace(/\s/g, ''), 'base64'
            ).toString('utf8');
            if (release.body !== notes) {
              throw new Error('Published release description differs from tagged notes.');
            }
            for (const warning of [
              'SOURCE-ONLY',
              'NOT a playable game build',
              'No compiled Win64 EXE',
              'Android APK/AAB',
              'not installers',
              'zero executable binaries'
            ]) {
              if (!notes.includes(warning)) {
                throw new Error('Required source-only warning missing: ' + warning);
              }
            }
            if (context.eventName === 'release' &&
                context.payload.release.id !== release.id) {
              throw new Error('Release event ID does not match fetched publication.');
            }
            core.notice('Verified source-only release: ' +
              release.html_url + ' @ ' + ref.sha +
              ' (notes exact, zero executable attachments).');
