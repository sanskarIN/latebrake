name: Audit published source-only GitHub release (READ-ONLY)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published source-only tag to verify (e.g. v0.5.85)'
        required: true
        type: string

# Metadata verification only: not a playable-game build or a
# replacement for the actual publishing qualification jobs.
permissions:
  contents: read

jobs:
  audit-source-release:
    name: Verify tag, exact source notes and zero game attachments
    if: github.repository == 'sanskarIN/latebrake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Audit immutable published snapshot using GitHub API
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            // Trust only approved, read-only local policy. Checkout pins its
            // source to main even when a release event points to an older tag.
            const policy = require('./scripts/AuditPublishedSourceRelease.cjs');
            const {owner, repo} = context.repo;
            const tag = context.eventName === 'release'
              ? context.payload.release?.tag_name
              : process.env.INPUT_TAG;
            const classification = policy.classifySourceTag(tag);
            
            const release = (await github.rest.repos.getReleaseByTag({
              owner, repo, tag
            })).data;
            const reference = (await github.rest.git.getRef({
              owner, repo, ref: 'tags/' + tag
            })).data;
            
            let sourceNotes;
            if (classification.notesPath) {
              // Ordinary versioned releases retain the strongest existing gate:
              // read the EXACT notes committed at the immutable direct tag SHA.
              const noteFile = (await github.rest.repos.getContent({
                owner, repo, path: classification.notesPath,
                ref: reference.object.sha
              })).data;
              if (Array.isArray(noteFile) || noteFile.type !== 'file' ||
                  noteFile.encoding !== 'base64' ||
                  typeof noteFile.content !== 'string') {
                throw new Error('Source-tagged release notes are not a regular file.');
              }
              sourceNotes = Buffer.from(
                noteFile.content.replace(/\s/g, ''), 'base64'
              ).toString('utf8');
            }
            
            const checked = policy.verifyPublishedSourceRelease({
              tag, release, reference, sourceNotes,
            });
            if (context.eventName === 'release' &&
                context.payload.release.id !== release.id) {
              throw new Error('Release event ID does not match fetched publication.');
            }
            core.notice('Verified source-only release metadata: ' +
              release.html_url + ' @ ' + checked.sha +
              ' (' + checked.kind + ', zero attachments). ' +
              'NOT evidence of Unreal compilation or a playable build.');
