name: Publish LateBrake v0.5.74 SOURCE-ONLY pre-release

on:
  # Adding this file to main starts its own FULL source qualification.
  # No game binary can be produced or attached by this workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.5.74-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0.5.74-source-prerelease
  cancel-in-progress: false

jobs:
  source-tests:
    name: Release source C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure portable racing code
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile all C++20 production policy tests
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Run complete source test suite
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure
      - name: Explicitly check v0.5.74 Gamepad and Drive Input subsystems
        run: ctest --test-dir Tests/Standalone/build -C Release -R "^(DriveAxisDeadzone|DriverInputSafety|DriftComboMeter|TouchCameraCyclePolicy)$" --output-on-failure

  editor-tests:
    name: Release Python/Unreal-source contracts (NO Unreal runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v

  packaging-policy:
    name: Release candidate provenance policies (synthetic NOT installers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check PowerShell syntax and existing fake-archive rejection fixtures
        shell: pwsh
        run: |
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name): $_" }
              exit 1
            }
          }
          foreach ($script in @(
            './scripts/Test-PackagingPolicy.ps1',
            './scripts/Test-CandidateManifestPolicy.ps1',
            './scripts/Test-SourceProvenancePolicy.ps1',
            './scripts/Test-CandidateMapSnapshotPolicy.ps1',
            './scripts/Test-EngineBuildSnapshotPolicy.ps1',
            './scripts/Test-MapAuthoringReceiptPolicy.ps1',
            './scripts/Test-CandidatePairIdentityPolicy.ps1'
          )) {
            & $script
            if (-not $?) {
              throw "Policy check failed: $script"
            }
          }

  documentation:
    name: Render and verify source preview docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: python -m pip install --requirement docs-requirements.txt
      - run: python -m mkdocs build --clean
      - run: python scripts/verify_docs_site.py site

  source-prerelease:
    name: Publish immutable tested v0.5.74 (ZERO game binaries)
    needs: [source-tests, editor-tests, packaging-policy, documentation]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source-only pre-release exactly at CI-qualified commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const tag = 'v0.5.74';
            const sha = context.sha;
            const notes = fs.readFileSync('docs/releases/v0.5.74.md', 'utf8');

            for (const marker of [
              'SOURCE-ONLY', 'NOT a playable game build', 'No compiled Win64 EXE',
              'Android APK/AAB', 'not installers', 'zero executable binaries'
            ]) {
              if (!notes.includes(marker)) {
                throw new Error('Missing mandatory source-preview warning: ' + marker);
              }
            }

            // Never label a different/untested revision with this source tag.
            const main = (await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            })).data.commit.sha;
            if (main !== sha) {
              throw new Error('main advanced during source qualification; do not retag.');
            }
            const previous = (await github.rest.repos.getReleaseByTag({
              owner, repo, tag: 'v0.5.73'
            })).data;
            if (previous.draft || !previous.prerelease ||
                previous.assets.length !== 0) {
              throw new Error('Previous source-only pre-release policy changed.');
            }

            let existingRef;
            try {
              existingRef = (await github.rest.git.getRef({
                owner, repo, ref: 'tags/' + tag
              })).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existingRef) {
              if (existingRef.type !== 'commit' || existingRef.sha !== sha) {
                throw new Error('Existing v0.5.74 tag points elsewhere; refusing rewrite.');
              }
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/tags/' + tag, sha
              });
            }

            let published;
            try {
              published = (await github.rest.repos.getReleaseByTag({
                owner, repo, tag
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!published) {
              published = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha,
                name: 'LateBrake v0.5.74 — Signed Analog Deadzones (SOURCE-ONLY Pre-release)',
                body: notes,
                draft: false, prerelease: true,
                generate_release_notes: false, make_latest: 'false'
              })).data;
            }
            if (published.draft || !published.prerelease ||
                published.tag_name !== tag || published.body !== notes ||
                published.assets.length !== 0) {
              throw new Error('Release violates immutable asset-free source-only contract.');
            }
            core.notice('Published verified source-only preview: ' + published.html_url + ' @ ' + sha);
