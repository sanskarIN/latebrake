name: C++ race logic

on:
  # PR revisions run the complete source matrix under pull_request.
  # Do not run a second identical matrix for each feat/* or fix/* push:
  # duplicate workflows were occupying hosted CI capacity while source-only
  # pre-release publication jobs waited in GitHub's queue.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest revision of a branch or PR needs a full portable CI matrix.
# Keep push and PR verification independent; cancel obsolete runs within
# each event/ref group to avoid queued superseded per-commit matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Portable C++20 tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS recompiles 88 strict C++20 policy binaries per revision.
      # Only reusable compiler objects are cached; no game binary,
      # Unreal output, secrets or QA evidence are cached or published.
      - name: Prepare optional macOS compiler cache
        id: macos_ccache
        if: matrix.os == 'macos-latest'
        run: |
          if command -v ccache >/dev/null 2>&1 || brew install ccache; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ccache --version
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ccache unavailable; building the complete source suite without cache."
          fi
      - name: Restore macOS compiler object cache
        if: matrix.os == 'macos-latest' && steps.macos_ccache.outputs.available == 'true'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/latebrake-ccache
          key: latebrake-macos-cxx20-${{ hashFiles('Tests/Standalone/CMakeLists.txt', 'Tests/Standalone/*.cpp', 'Source/Latebrake/Public/**/*.h', 'Source/Latebrake/Private/**/*.cpp') }}
          restore-keys: |
            latebrake-macos-cxx20-
      - name: Configure macOS with reusable C++ objects
        if: matrix.os == 'macos-latest' && steps.macos_ccache.outputs.available == 'true'
        env:
          CCACHE_DIR: ${{ runner.temp }}/latebrake-ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPRESS: 'true'
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Configure without optional macOS cache
        if: matrix.os != 'macos-latest' || steps.macos_ccache.outputs.available != 'true'
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      # 126 independent C++20 binaries can launch hundreds of compiler
      # processes with unlimited --parallel on a small hosted runner.
      # Bound concurrent compilation while still building EVERY target
      # and running the complete unchanged CTest/source-binding suite.
      - name: Build
        env:
          CCACHE_DIR: ${{ runner.temp }}/latebrake-ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPRESS: 'true'
        run: cmake --build Tests/Standalone/build --config Release --parallel 4
      - name: Report macOS cache statistics
        if: matrix.os == 'macos-latest' && steps.macos_ccache.outputs.available == 'true'
        env:
          CCACHE_DIR: ${{ runner.temp }}/latebrake-ccache
        run: ccache --show-stats
      - name: Test
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  packaging-script-syntax:
    name: Release PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse package and verification scripts
        shell: pwsh
        run: |
          foreach ($script in @('scripts/Build-Editor.ps1', 'scripts/Compile-UnrealEditor.ps1', 'scripts/Test-EditorCompileGatePolicy.ps1', 'scripts/Test-UnrealWorkstationPrerequisites.ps1', 'scripts/Test-UnrealWorkstationPrerequisitesPolicy.ps1', 'scripts/New-StarterMap.ps1', 'scripts/New-RoundedCircuitLab.ps1', 'scripts/New-ContinuousRoadLab.ps1', 'scripts/Audit-ContinuousRoadQueries.ps1', 'scripts/Test-MapAuthoringReceipt.ps1', 'scripts/Test-MapAuthoringReceiptPolicy.ps1', 'scripts/Test-SourceProvenance.ps1', 'scripts/Test-SourceProvenancePolicy.ps1', 'scripts/Test-CandidateMapSnapshot.ps1', 'scripts/Test-CandidateMapSnapshotPolicy.ps1', 'scripts/Test-EngineBuildSnapshot.ps1', 'scripts/Test-EngineBuildSnapshotPolicy.ps1', 'scripts/Test-CandidatePairIdentity.ps1', 'scripts/Test-CandidatePairIdentityPolicy.ps1', 'scripts/Build-PlayableCandidate.ps1', 'scripts/Build-WindowsPlaytest.ps1', 'scripts/Test-WindowsPlaytestWrapperPolicy.ps1', 'scripts/Run-WindowsPlaytest.ps1', 'scripts/Test-PostRunWin64CandidateIntegrity.ps1', 'scripts/Test-PostRunWin64CandidateIntegrityPolicy.ps1', 'scripts/Assert-SafeWindowsPlaytestLogDirectory.ps1', 'scripts/Test-WindowsLogDirectoryPolicy.ps1', 'scripts/Test-WindowsRuntimePlaytestPolicy.ps1', 'scripts/Build-PreRelease.ps1', 'scripts/Verify-ReleaseArtifacts.ps1', 'scripts/Verify-PlatformPackage.ps1', 'scripts/Write-CandidateManifest.ps1', 'scripts/Verify-UnrealMapHeader.ps1', 'scripts/Verify-RuntimeStartupLog.ps1', 'scripts/Test-UATPackageStructure.ps1', 'scripts/Test-CandidateManifest.ps1', 'scripts/Test-CandidateManifestPolicy.ps1', 'scripts/Test-PackagingPolicy.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $_" }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $script"
          }
      - name: Parse inline manual Unreal candidate PowerShell without launching UE
        shell: pwsh
        run: ./scripts/Test-UnrealCandidateWorkflowInlineSyntaxPolicy.ps1
      - name: Parse owner-approved PR UE workflow PowerShell without launching Unreal
        shell: pwsh
        run: ./scripts/Test-UnrealCandidateWorkflowInlineSyntax.ps1 -WorkflowPath .github/workflows/validate-draft-unreal-pr.yml
      - name: Reject invalid packaging fixtures without engine
        shell: pwsh
        run: ./scripts/Test-PackagingPolicy.ps1
      - name: Reject nonexistent Unreal Editor before compiling (NO UE executed)
        shell: pwsh
        run: ./scripts/Test-EditorCompileGatePolicy.ps1
      - name: Reject invalid UE workstation prerequisites before real compilation (NO UE executed)
        shell: pwsh
        run: ./scripts/Test-UnrealWorkstationPrerequisitesPolicy.ps1
      - name: Reject unavailable UE in the private Windows playtest launcher (NO game built)
        shell: pwsh
        run: ./scripts/Test-WindowsPlaytestWrapperPolicy.ps1
      - name: Reject fake private Win64 runtime candidates before any EXE launch
        shell: pwsh
        run: ./scripts/Test-WindowsRuntimePlaytestPolicy.ps1
      - name: Reject fake post-run archive drift without launching a game
        shell: pwsh
        run: ./scripts/Test-PostRunWin64CandidateIntegrityPolicy.ps1
      - name: Reject junction-escaped and contained private Win64 runtime log paths
        shell: pwsh
        run: ./scripts/Test-WindowsLogDirectoryPolicy.ps1
      - name: Test full archive manifest integrity with disposable fake files
        shell: pwsh
        run: ./scripts/Test-CandidateManifestPolicy.ps1
      - name: Reject untracked source in disposable Git histories
        shell: pwsh
        run: ./scripts/Test-SourceProvenancePolicy.ps1
      - name: Reject map mutation between Unreal build stages (synthetic bytes only)
        shell: pwsh
        run: ./scripts/Test-CandidateMapSnapshotPolicy.ps1
      - name: Reject engine Build.version changes between Editor and UAT (synthetic metadata only)
        shell: pwsh
        run: ./scripts/Test-EngineBuildSnapshotPolicy.ps1
      - name: Verify real-map authoring receipt policy with disposable synthetic bytes
        shell: pwsh
        run: ./scripts/Test-MapAuthoringReceiptPolicy.ps1
      - name: Reject inconsistent Windows and Android candidate identities
        shell: pwsh
        run: ./scripts/Test-CandidatePairIdentityPolicy.ps1



  rounded-visual-road-preview:
    name: Export UNVERIFIED continuous 3D road (NOT a playable game)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 316
    needs: [portable-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure portable original mesh and OBJ exporter
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Build source-generated continuous ribbon tests and exporter
        run: |
          cmake --build Tests/Standalone/build --config Release \
            --target latebrake_rounded_smooth_mesh_tests latebrake_rounded_smooth_obj_exporter --parallel 4
      - name: Independently verify actual compiled mesh and OBJ
        run: |
          ctest --test-dir Tests/Standalone/build -C Release \
            -R RoundedSmoothRoad --no-tests=error --output-on-failure
      - name: Generate STATIC VISUAL-ONLY preview without a game executable
        shell: bash
        run: |
          mkdir -p Tests/Standalone/build/rounded-road-art-preview
          Tests/Standalone/build/latebrake_rounded_smooth_obj_exporter \
            Tests/Standalone/build/rounded-road-art-preview/LateBrakeRoundedVisualRoad.obj
          python3 Tests/Standalone/VerifyRoundedSmoothRoadObj.py \
            Tests/Standalone/build/latebrake_rounded_smooth_obj_exporter
          printf '%s\n' \
            'LateBrake ORIGINAL ROUNDED ROAD VISUAL MESH - UNVERIFIED' \
            'OBJ/MTL = static source-generated 3D geometry only.' \
            'NOT a playable Windows game, Unreal material, Editor test, collision mesh, or installer.' \
            'Existing 68 physical road boxes are authoritative in the separate test lab.' \
            'Simple material placeholders are NOT realistic PBR textures.' \
            'Open the OBJ file with a 3D model viewer; do NOT infer driving or graphics QA.' \
            > Tests/Standalone/build/rounded-road-art-preview/READ_ME_FIRST.txt
          (cd Tests/Standalone/build/rounded-road-art-preview &&
            sha256sum LateBrakeRoundedVisualRoad.obj LateBrakeRoundedVisualRoad.mtl \
              > SHA256SUMS.txt)
      - name: Archive UNVERIFIED OBJ-only 3D visual preview (no game executable)
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-RoundedRoad-OBJ-Only-${{ github.sha }}
          path: Tests/Standalone/build/rounded-road-art-preview/
          if-no-files-found: error
          retention-days: 7

  world-scale-rounded-road-preview:
    name: Export UNVERIFIED 1.70-km original 3D road (NOT playable)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 316
    needs: [portable-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure world-scale original road source
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile the 1.70-km geometry policy and real OBJ exporter
        run: |
          cmake --build Tests/Standalone/build --config Release \
            --target latebrake_world_scale_rounded_tests latebrake_world_scale_rounded_obj_exporter \
              latebrake_world_scale_rounded_circuit_lab_exporter --parallel 4
      - name: Require actual physical backing and independently verified 10x OBJ
        run: |
          ctest --test-dir Tests/Standalone/build -C Release \
            -R '^WorldScaleRounded' --no-tests=error --output-on-failure
      - name: Generate full-scale non-colliding 3D road model with evidence
        shell: bash
        run: |
          mkdir -p Tests/Standalone/build/world-scale-visual-only-preview
          Tests/Standalone/build/latebrake_world_scale_rounded_obj_exporter \
            Tests/Standalone/build/world-scale-visual-only-preview/LateBrake_1p70km_OriginalTrack.obj
          python3 Tests/Standalone/VerifyRoundedSmoothRoadObj.py \
            Tests/Standalone/build/latebrake_world_scale_rounded_obj_exporter 10
          printf '%s\n' \
            'LateBrake ORIGINAL 1.70-KM WORLD-SCALE TRACK: UNVERIFIED 3D GEOMETRY ONLY' \
            'Lap about 1702.65 metres; original physical collision corridor 9 metres wide.' \
            'No real Unreal Engine editor compile, asset import, lighting, textures, physics, or driving QA.' \
            'OBJ/MTL is NON-COLLIDING VISUAL geometry, not a playable Win64 game or installer.' \
            'The 68 matching 9-m-wide physical collision pieces exist as C++ source plan ONLY.' \
            'Old 170-m lab, career track and published v0.5.95 remain unchanged.' \
            > Tests/Standalone/build/world-scale-visual-only-preview/READ_ME_FIRST.txt
          (cd Tests/Standalone/build/world-scale-visual-only-preview &&
            sha256sum LateBrake_1p70km_OriginalTrack.obj LateBrake_1p70km_OriginalTrack.mtl \
              > SHA256SUMS.txt)
      - name: Archive original 1.70-km full-size visual model (no game assets)
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-Original-1p70km-Road-OBJ-${{ github.sha }}
          path: Tests/Standalone/build/world-scale-visual-only-preview/
          if-no-files-found: error
          retention-days: 7

  continuous-physical-obj-preview:
    name: Export UNVERIFIED 9m collision-road OBJ for offline inspection (NOT a game)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 316
    needs: [portable-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure original FULL-WIDTH collision geometry test source
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile actual physical source OBJ producer and geometry test
        run: |
          cmake --build Tests/Standalone/build --config Release \
            --target latebrake_world_scale_collision_obj_exporter \
              latebrake_world_scale_smooth_collision_tests --parallel 4
      - name: Require independently verified physical 9m OBJ and manifold
        run: |
          ctest --test-dir Tests/Standalone/build -C Release \
            -R '^WorldScale(SmoothCollisionSurface|CollisionRoadObjContract)$' \
            --no-tests=error --output-on-failure
      - name: Export exact model and destructive-validation provenance
        shell: bash
        run: |
          set -euo pipefail
          target=Tests/Standalone/build/continuous-physical-road-NOT-PLAYABLE
          mkdir -p "$target"
          Tests/Standalone/build/latebrake_world_scale_collision_obj_exporter \
            "$target/SM_WorldScaleContinuousRoad.obj"
          python3 Tests/Standalone/VerifyWorldScaleCollisionRoadObj.py \
            Tests/Standalone/build/latebrake_world_scale_collision_obj_exporter
          python3 Tests/Standalone/WorldScaleCollisionTracePlan.py \
            "$target/SourceOnly_StaticCollisionProbes_1290.json"
          printf '%s\n' \
            'WARNING — SOURCE GEOMETRY ONLY. NOT a playable Windows game or installer.' \
            'Original 1.70-km static-road physical model with 9-m corridor and 42-cm depth.' \
            'Includes 1,290 PLANNED line-query coordinates; zero genuine Unreal rays were fired in CI.' \
            'OBJ is NOT an Unreal StaticMesh/.uasset, cooked Chaos collision, or real wheel contact.' \
            'Unreal Engine 5.8 Editor import API and hardware/vehicle tests have NOT been exercised.' \
            'The live race map and original 68-slab Editor lab remain unchanged.' \
            'Import through manually run scripts/New-ContinuousRoadLab.ps1 ONLY on UE5.8 Windows.' \
            'Experimental PR #316; all real installed playability checks remain issue #148.' \
            > "$target/READ_ME_FIRST.txt"
          (cd "$target" && sha256sum SM_WorldScaleContinuousRoad.obj \
            SM_WorldScaleContinuousRoad.mtl SourceOnly_StaticCollisionProbes_1290.json \
            > SHA256SUMS.txt)
      - name: Archive source physical-road model only (no EXE)
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-9m-ContinuousCollision-OBJ-${{ github.sha }}
          path: Tests/Standalone/build/continuous-physical-road-NOT-PLAYABLE/
          if-no-files-found: error
          retention-days: 7

  editor-script-syntax:
    name: Unreal editor-only Python syntax (not Unreal runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Unreal Editor automation source
        run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py scripts/Unreal/CreateRoundedCircuitLab.py scripts/Unreal/ImportWorldScaleContinuousRoad.py scripts/Unreal/AuditWorldScaleContinuousRoad.py Tests/Standalone/WorldScaleCollisionTracePlan.py
      - name: Test editor map automation decisions with disposable stub (NO Unreal SDK)
        run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v
