name: C++ race logic

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable C++20 tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Test
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  packaging-script-syntax:
    name: Release PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse package and verification scripts
        shell: pwsh
        run: |
          foreach ($script in @('scripts/Build-Editor.ps1', 'scripts/New-StarterMap.ps1', 'scripts/Build-PlayableCandidate.ps1', 'scripts/Build-PreRelease.ps1', 'scripts/Verify-ReleaseArtifacts.ps1', 'scripts/Verify-PlatformPackage.ps1', 'scripts/Write-CandidateManifest.ps1', 'scripts/Verify-UnrealMapHeader.ps1', 'scripts/Verify-RuntimeStartupLog.ps1', 'scripts/Test-CandidateManifest.ps1', 'scripts/Test-CandidateManifestPolicy.ps1', 'scripts/Test-PackagingPolicy.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $_" }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $script"
          }
      - name: Reject invalid packaging fixtures without engine
        shell: pwsh
        run: ./scripts/Test-PackagingPolicy.ps1
      - name: Test full archive manifest integrity with disposable fake files
        shell: pwsh
        run: ./scripts/Test-CandidateManifestPolicy.ps1

  editor-script-syntax:
    name: Unreal editor-only Python syntax (not Unreal runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Unreal Editor automation source
        run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - name: Test editor map automation decisions with disposable stub (NO Unreal SDK)
        run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v
