name: C++ race logic

on:
  # PR revisions run the complete source matrix under pull_request.
  # Do not run a second identical matrix for each feat/* or fix/* push:
  # duplicate workflows were occupying hosted CI capacity while source-only
  # pre-release publication jobs waited in GitHub's queue.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest revision of a branch or PR needs a full portable CI matrix.
# Keep push and PR verification independent; cancel obsolete runs within
# each event/ref group to avoid queued superseded per-commit matrices.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Portable C++20 tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Test
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  packaging-script-syntax:
    name: Release PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse package and verification scripts
        shell: pwsh
        run: |
          foreach ($script in @('scripts/Build-Editor.ps1', 'scripts/New-StarterMap.ps1', 'scripts/Test-MapAuthoringReceipt.ps1', 'scripts/Test-MapAuthoringReceiptPolicy.ps1', 'scripts/Test-SourceProvenance.ps1', 'scripts/Test-SourceProvenancePolicy.ps1', 'scripts/Test-CandidateMapSnapshot.ps1', 'scripts/Test-CandidateMapSnapshotPolicy.ps1', 'scripts/Test-EngineBuildSnapshot.ps1', 'scripts/Test-EngineBuildSnapshotPolicy.ps1', 'scripts/Test-CandidatePairIdentity.ps1', 'scripts/Test-CandidatePairIdentityPolicy.ps1', 'scripts/Build-PlayableCandidate.ps1', 'scripts/Build-PreRelease.ps1', 'scripts/Verify-ReleaseArtifacts.ps1', 'scripts/Verify-PlatformPackage.ps1', 'scripts/Write-CandidateManifest.ps1', 'scripts/Verify-UnrealMapHeader.ps1', 'scripts/Verify-RuntimeStartupLog.ps1', 'scripts/Test-UATPackageStructure.ps1', 'scripts/Test-CandidateManifest.ps1', 'scripts/Test-CandidateManifestPolicy.ps1', 'scripts/Test-PackagingPolicy.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $_" }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $script"
          }
      - name: Parse inline manual Unreal candidate PowerShell without launching UE
        shell: pwsh
        run: ./scripts/Test-UnrealCandidateWorkflowInlineSyntaxPolicy.ps1
      - name: Reject invalid packaging fixtures without engine
        shell: pwsh
        run: ./scripts/Test-PackagingPolicy.ps1
      - name: Test full archive manifest integrity with disposable fake files
        shell: pwsh
        run: ./scripts/Test-CandidateManifestPolicy.ps1
      - name: Reject untracked source in disposable Git histories
        shell: pwsh
        run: ./scripts/Test-SourceProvenancePolicy.ps1
      - name: Reject map mutation between Unreal build stages (synthetic bytes only)
        shell: pwsh
        run: ./scripts/Test-CandidateMapSnapshotPolicy.ps1
      - name: Reject engine Build.version changes between Editor and UAT (synthetic metadata only)
        shell: pwsh
        run: ./scripts/Test-EngineBuildSnapshotPolicy.ps1
      - name: Verify real-map authoring receipt policy with disposable synthetic bytes
        shell: pwsh
        run: ./scripts/Test-MapAuthoringReceiptPolicy.ps1
      - name: Reject inconsistent Windows and Android candidate identities
        shell: pwsh
        run: ./scripts/Test-CandidatePairIdentityPolicy.ps1

  editor-script-syntax:
    name: Unreal editor-only Python syntax (not Unreal runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Unreal Editor automation source
        run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - name: Test editor map automation decisions with disposable stub (NO Unreal SDK)
        run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v
