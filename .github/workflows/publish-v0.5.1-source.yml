name: Publish LateBrake v0.5.1 SOURCE-ONLY pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.5.1-source.yml"
  workflow_dispatch:

# NEVER turn source archives into "playable" assets. Genuine engine builds
# require the separately gated authorized runner and installed hardware QA.
permissions:
  contents: read

concurrency:
  group: latebrake-v0.5.1-source-prerelease
  cancel-in-progress: false

jobs:
  portable-tests:
    name: Portable C++20 Release Tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure all portable racing and progression tests
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Build all strict C++20 test targets
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Execute all portable tests
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  packaging-script-policy:
    name: PowerShell parser and negative release-integrity tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all packaging scripts
        shell: pwsh
        run: |
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($script.Name) : $_" }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $($script.Name)"
          }
      - name: Reject missing engine and synthetic game packages
        shell: pwsh
        run: ./scripts/Test-PackagingPolicy.ps1
      - name: Reject corrupted or incomplete source candidate manifests
        shell: pwsh
        run: ./scripts/Test-CandidateManifestPolicy.ps1

  editor-automation-policy:
    name: Unreal Editor Python syntax/stub only (NOT UE build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Unreal Editor automation source
        run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - name: Run stubbed editor-map policy tests (no Unreal SDK)
        run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v

  publish:
    name: Tag exact passed revision and publish source pre-release
    needs: [portable-tests, packaging-script-policy, editor-automation-policy]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish v0.5.1 — SOURCE ONLY / NO GAME EXECUTABLES
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const sha = context.sha;
            const tag = 'v0.5.1';
            const title = 'LateBrake v0.5.1 — Reliability & Circuit Optimization (SOURCE-ONLY Pre-release)';
            const notes = fs.readFileSync('docs/releases/v0.5.1.md', 'utf8');
            if (!notes.includes('SOURCE-ONLY') || !notes.includes('NOT a playable game build') ||
                !notes.includes('No compiled Win64 EXE') || !notes.includes('Android APK/AAB')) {
              throw new Error('Release notes must warn clearly that no playable game is included.');
            }

            // Tag only the exact main commit which passed ALL release tests.
            // If the branch has moved since workflow checkout, rerun explicitly
            // from the desired main head instead of silently tagging old work.
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (main.data.commit.sha !== sha) {
              throw new Error('main moved during release validation; refusing stale pre-release tag.');
            }
            await github.rest.repos.getReleaseByTag({owner, repo, tag: 'v0.5.0'});

            let tagRef;
            try {
              tagRef = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data.object;
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            if (tagRef) {
              if (tagRef.type !== 'commit' || tagRef.sha !== sha) {
                throw new Error('v0.5.1 already exists at a DIFFERENT SHA: will not move the tag.');
              }
            } else {
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha});
              core.info('Created immutable lightweight release tag ' + tag + ' @ ' + sha);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha,
                name: title, body: notes, draft: false, prerelease: true,
                make_latest: 'false', generate_release_notes: false
              })).data;
            }
            if (release.draft || !release.prerelease || release.tag_name !== tag ||
                release.assets.length !== 0 || release.body !== notes) {
              throw new Error('Release metadata, no-binary guarantee or source notes failed verification.');
            }
            core.notice('SOURCE-ONLY pre-release published and verified: ' + release.html_url + ' @ ' + sha);
