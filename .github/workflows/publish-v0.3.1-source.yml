name: Publish v0.3.1 garage-hardening source pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.1-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0.3.1-source-preview
  cancel-in-progress: false

jobs:
  tests:
    name: Test portable C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 tests
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile source tests
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Execute racing, AI and rewards tests
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  publish:
    name: Publish clearly labeled SOURCE-ONLY pre-release
    needs: [tests]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish source revision as v0.3.1 pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'v0.3.1';
            const sha = context.sha;
            const expectedParent = 'v0.3.0';
            await github.rest.repos.getReleaseByTag({owner, repo, tag: expectedParent});
            const notes = [
              '## Latebrake v0.3.1 — source-only development pre-release',
              '',
              '**No verified playable Windows, Linux, or Android game is included.**',
              'The downloadable GitHub source archives contain uncompiled Unreal Engine C++ code. Unreal Editor/UHT game builds, packaging, and real-game testing have NOT been performed.',
              '',
              '### Improvements in this source preview',
              '- Garage saved-profile hardening: negative/corrupt ownership masks do not grant free vehicles.',
              '- Centralized owned/locked vehicle lookup and upgrade price previews in the offline garage logic.',
              '- Garage transaction feedback for insufficient credits, purchased cars, selection and maxed upgrades.',
              '- Compact screen-aware racing HUD layout with information appropriate for smaller viewports.',
              '- Better saved-record validation: reject invalid/nonfinite race times and prevent completion count overflow.',
              '- Portable C++20 regression tests for garage migration edge cases, HUD scaling and record sanitation.',
              '',
              '### Verification',
              '- This automated release runs CMake/CTest on Windows, Ubuntu and macOS on the exact tagged merge commit.',
              '- The tests cover standalone C++ only, not Unreal Engine game classes, physics, SaveGame file IO, Android touch, or the displayed HUD.',
              '',
              '### Still missing for playable/stable releases',
              '- An authorized Unreal Engine 5.8 editor/UHT build, original cookable maps/models, Windows/Android builds, SaveGame migration playtests and hardware UX/performance testing.',
              '- Qualification issue: https://github.com/sanskarIN/latebrake/issues/2',
              'See docs/releases/v0.3.1.md, docs/GARAGE.md and docs/STATUS.md.',
              'Authored source BSD-3-Clause; Epic engine resources are separately licensed.'
            ].join('\n');

            let tagRef;
            try {
              const existingTag = await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag});
              tagRef = existingTag.data.object;
              if (tagRef.type !== 'commit' || tagRef.sha !== sha) {
                throw new Error('Tag already exists at a different revision: refusing to retag.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha});
              core.info('Created ' + tag + ' at ' + sha);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: sha,
                name: 'Latebrake v0.3.1 — Garage & HUD Reliability (Source Pre-release)',
                body: notes,
                draft: false,
                prerelease: true,
                make_latest: 'false',
                generate_release_notes: false
              })).data;
            }
            if (release.draft || !release.prerelease || release.tag_name !== tag) {
              throw new Error('v0.3.1 must be published as a non-draft source-only pre-release.');
            }
            core.notice('Published/verified: ' + release.html_url + ' @ ' + sha);
