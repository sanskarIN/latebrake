name: Publish LateBrake v0.5.92 experimental SOURCE-ONLY prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-suspension-v0592-experimental.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0592-experimental-source-only
  cancel-in-progress: false

env:
  RELEASE_COMMIT: 13f5588b64462a6dcdcb7d7406c584c63837e87b

jobs:
  preflight:
    name: Authenticate exact open same-repository draft PR and notes
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject stale PR head, non-owner code or mismatched notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const candidate = process.env.RELEASE_COMMIT;
            if (!/^[0-9a-f]{40}$/.test(candidate)) throw Error('Bad candidate SHA');
            const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if (main !== context.sha) throw Error('Protected main moved');
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:295})).data;
            if (pr.state !== 'open' || !pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'feat/chaos-four-corner-suspension' ||
                pr.head.repo?.full_name !== 'sanskarIN/latebrake' ||
                pr.head.user?.login !== 'sanskarIN' || pr.head.sha !== candidate) {
              throw Error('Untrusted or changed draft PR head');
            }
            const notes = fs.readFileSync('docs/releases/v0.5.92.md','utf8');
            const sourceNotes = (await github.rest.repos.getContent({
              owner,repo,path:'docs/releases/v0.5.92.md',ref:candidate
            })).data;
            if (sourceNotes.encoding !== 'base64' ||
                Buffer.from(sourceNotes.content,'base64').toString('utf8') !== notes) {
              throw Error('Publisher notes do not match exact candidate');
            }
            for (const marker of [
              'SOURCE-ONLY','NOT a playable game build','No compiled Win64 EXE',
              'Android APK/AAB','not installers','zero executable binaries',
              'unmerged development','four-corner'
            ]) {
              if (!notes.includes(marker)) throw Error('Missing source warning: '+marker);
            }

  source-tests:
    name: Complete exact-source portable C++20 / ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13f5588b64462a6dcdcb7d7406c584c63837e87b
          persist-credentials: false
      - name: Require exact candidate source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Tests/Standalone/build --config Release --parallel 4
      - run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure
      - name: Require each physical suspension policy target independently
        shell: bash
        run: |
          for target in ChassisGroundContactTraction SprungChassisDynamics SprungChassisRideHeight SprungChassisAttitudeRecovery AxleTractionBudget ChassisContactReadout SprungGripReattachment ChassisWheelGeometry SuspensionQaCadence SuspensionMountAttitude AirborneRoadLoad MeasuredPlanarForwardSpeed PlanarSpeedGovernor OpposingThrottleBraking TractionLimitedPropulsion SuspensionRayVelocity; do
            ctest --test-dir Tests/Standalone/build -C Release -R "^$target$" --no-tests=error --output-on-failure || exit 1
          done

  editor-tests:
    name: Unreal C++ source bindings only (NOT UE compilation)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13f5588b64462a6dcdcb7d7406c584c63837e87b
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v

  packaging-policy:
    name: PowerShell syntax and synthetic candidate policy (NO installer)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13f5588b64462a6dcdcb7d7406c584c63837e87b
          persist-credentials: false
      - name: Verify exact source and source-only packaging safety
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_COMMIT) { throw 'Source mismatch' }
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Invalid syntax in $($script.Name)" }
          }
          & ./scripts/Test-PackagingPolicy.ps1
          if (-not $?) { throw 'Packaging policy failed' }
          & ./scripts/Test-SourceProvenancePolicy.ps1
          if (-not $?) { throw 'Provenance policy failed' }

  documentation:
    name: Build and verify exact source-only docs
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13f5588b64462a6dcdcb7d7406c584c63837e87b
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: python -m pip install --requirement docs-requirements.txt
      - run: python -m mkdocs build --strict --clean
      - run: python scripts/verify_docs_site.py site

  source-prerelease:
    name: Publish immutable v0.5.92 (zero executable assets)
    needs: [preflight, source-tests, editor-tests, packaging-policy, documentation]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish only exact successful same-repo draft PR source snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const tag = 'v0.5.92';
            const sha = process.env.RELEASE_COMMIT;
            const notes = fs.readFileSync('docs/releases/v0.5.92.md','utf8');
            const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if (main !== context.sha) throw Error('main changed after qualification');
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:295})).data;
            if (pr.state !== 'open' || !pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'feat/chaos-four-corner-suspension' ||
                pr.head.repo?.full_name !== 'sanskarIN/latebrake' ||
                pr.head.user?.login !== 'sanskarIN' || pr.head.sha !== sha) {
              throw Error('Draft PR moved during qualification');
            }
            const sourceFile = (await github.rest.repos.getContent({
              owner,repo,path:'docs/releases/v0.5.92.md',ref:sha
            })).data;
            if (sourceFile.encoding !== 'base64' ||
                Buffer.from(sourceFile.content,'base64').toString('utf8') !== notes) {
              throw Error('Source notes drifted from the publisher');
            }
            const previous = (await github.rest.repos.getReleaseByTag({
              owner,repo,tag:'v0.5.91'
            })).data;
            const previousRef = (await github.rest.git.getRef({
              owner,repo,ref:'tags/v0.5.91'
            })).data.object;
            if (previous.draft || !previous.prerelease || !previous.published_at ||
                !Number.isFinite(Date.parse(previous.published_at)) ||
                previous.assets.length !== 0 || previousRef.type !== 'commit' ||
                previousRef.sha !== '8edba49c0a6294ece2797c708d80b6dd52288d40' ||
                previous.target_commitish !== previousRef.sha ||
                previous.body !== fs.readFileSync('docs/releases/v0.5.91.md','utf8')) {
              throw Error('Previous source-only milestone no longer qualifies');
            }
            let ref;
            try {
              ref = (await github.rest.git.getRef({owner,repo,ref:'tags/'+tag})).data.object;
            } catch(error) {
              if (error.status !== 404) throw error;
            }
            if (ref) {
              if (ref.type !== 'commit' || ref.sha !== sha) {
                throw Error('Never rewrite another immutable tag');
              }
            }
            let published;
            try {
              published = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            } catch(error) {
              if (error.status !== 404) throw error;
            }
            const releaseName = 'LateBrake v0.5.92 — Suspension and Traction Refinement (SOURCE-ONLY Pre-release)';
            const assertRelease = release => {
              if (release.draft || !release.prerelease || !release.published_at ||
                  !Number.isFinite(Date.parse(release.published_at)) ||
                  release.tag_name !== tag || release.target_commitish !== sha ||
                  release.name !== releaseName || release.body !== notes ||
                  release.assets.length !== 0) {
                throw Error('Published source snapshot identity/zero-assets check failed');
              }
            };
            // Inspect BOTH existing objects before any write. Never repair,
            // overwrite or delete an inconsistent public tag/release.
            if (published && !ref) throw Error('Existing release has no immutable tag');
            if (published) assertRelease(published);
            if (!ref) {
              await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+tag,sha});
            }
            if (!published) {
              published = (await github.rest.repos.createRelease({
                owner,repo,tag_name:tag,target_commitish:sha,
                name:releaseName,
                body:notes,draft:false,prerelease:true,
                generate_release_notes:false,make_latest:'false'
              })).data;
            }
            assertRelease(published);
            core.notice('Published source-only v0.5.92: '+published.html_url+' @ '+sha);
