name: Audit planned v0.5.100 SOURCE-ONLY pre-release (READ ONLY)

# This workflow is strictly a manual, protected-main *read-only* check.
# Never expose any write token or execute untrusted PR content here.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact reviewed protected-main SHA (40 lowercase hex)"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: latebrake-v05100-source-readiness-readonly
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'sanskarIN/latebrake' &&
      github.actor == 'sanskarIN' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline audit state-machine tests (no GitHub writes)
        run: node --test Tests/Release/SourceReleaseV05100ReadinessTests.cjs
      - name: Inspect source identity, checks and release state (read only)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gate = require('./scripts/SourceReleaseV05100Readiness.cjs');
            const notes = fs.readFileSync(gate.NOTES_PATH, 'utf8');
            const candidateSha = context.payload.inputs?.candidate_sha;
            const report = await gate.inspectReadiness({
              github, context, candidateSha, notes
            });
            core.notice('Read-only v0.5.100 source preflight: ' +
              JSON.stringify(report));
            core.notice('This is not a publication, Unreal compile or installed-game QA.');
