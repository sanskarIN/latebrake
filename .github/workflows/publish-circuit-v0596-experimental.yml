name: Publish LateBrake v0.5.96 World-Scale Circuit SOURCE-ONLY pre-release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-circuit-v0596-experimental.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0596-full-scale-track-source-only
  cancel-in-progress: false

env:
  RELEASE_COMMIT: 5bbea98bc085f1ab7f8a6dde0cf6b9f9d160bdd7

jobs:
  preflight:
    name: Verify exact trusted draft PR and source note bytes
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm immutable owner branch, pre-release predecessor and notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const sha = process.env.RELEASE_COMMIT;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('Invalid candidate SHA');
            if (!['push','workflow_dispatch'].includes(context.eventName)) throw Error('Unexpected publisher event');
            const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if (main !== context.sha) throw Error('Main changed after the publication run began');
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:316})).data;
            if (pr.state !== 'open' || !pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'feat/rounded-physical-circuit-plan-20261107' ||
                pr.head.repo?.full_name !== 'sanskarIN/latebrake' ||
                pr.head.user?.login !== 'sanskarIN' || pr.head.sha !== sha) {
              throw Error('Source candidate must remain the exact owner-controlled draft PR #316');
            }
            const notes = fs.readFileSync('docs/releases/v0.5.96.md', 'utf8');
            const candidate = (await github.rest.repos.getContent({
              owner,repo,path:'docs/releases/v0.5.96.md',ref:sha
            })).data;
            if (candidate.encoding !== 'base64' ||
                !Buffer.from(candidate.content,'base64').equals(Buffer.from(notes,'utf8'))) {
              throw Error('Publisher notes differ from pinned source commit');
            }
            for (const label of [
              'SOURCE-ONLY','NOT a playable game build','Win64 EXE',
              'Android APK/AAB','zero executable binaries','not installers',
              'unmerged development','WorldScaleSmoothCollisionSurface',
              'UE5.8','Chaos'
            ]) if (!notes.includes(label)) {
              throw Error('Required unverified/source-only disclosure missing: '+label);
            }
            const previous = (await github.rest.repos.getReleaseByTag({
              owner,repo,tag:'v0.5.95'
            })).data;
            if (!previous.prerelease || previous.draft ||
                previous.tag_name !== 'v0.5.95' || previous.assets.length !== 0) {
              throw Error('Previous immutable source-only prerelease changed');
            }
            core.notice('Pinned source-only candidate accepted: '+sha);

  source-tests:
    name: Exact source strict C++20 on ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5bbea98bc085f1ab7f8a6dde0cf6b9f9d160bdd7
          persist-credentials: false
      - name: Pin source checkout to PR #316 SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Tests/Standalone/build --config Release --parallel 4
      - run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure
      - name: Independently require continuous physical road and compiled export QA
        shell: bash
        run: |
          for testname in WorldScaleSmoothCollisionSurface WorldScaleRoundedCircuit WorldScaleRoundedCircuitLabJsonContract WorldScaleRoundedRoadObjContract; do
            ctest --test-dir Tests/Standalone/build -C Release -R "^$testname$" --no-tests=error --output-on-failure || exit 1
          done

  editor-tests:
    name: Exact-source Editor scripts and mock contracts ONLY
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5bbea98bc085f1ab7f8a6dde0cf6b9f9d160bdd7
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - run: python3 -m py_compile scripts/Unreal/CreateRoundedCircuitLab.py
      - run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v

  packaging-policy:
    name: Windows source-only script and safety checks
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5bbea98bc085f1ab7f8a6dde0cf6b9f9d160bdd7
          persist-credentials: false
      - name: Syntax parse ALL top-level packaging scripts and reject fake outputs
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:RELEASE_COMMIT) {
            throw 'Source identity mismatch'
          }
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parsing failed: $($script.Name)" }
          }
          ./scripts/Test-PackagingPolicy.ps1
          if (-not $?) { throw 'Packaging safety failed' }
          ./scripts/Test-SourceProvenancePolicy.ps1
          if (-not $?) { throw 'Source provenance policy failed' }

  documentation:
    name: Build complete source-only documentation for exact SHA
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5bbea98bc085f1ab7f8a6dde0cf6b9f9d160bdd7
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: python -m pip install -r docs-requirements.txt
      - run: python -m mkdocs build --clean
      - run: python scripts/verify_docs_site.py site

  source-prerelease:
    name: Publish immutable source-only v0.5.96 with ZERO assets
    needs: [preflight, source-tests, editor-tests, packaging-policy, documentation]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck immutable source, tag, draft and zero-game-binary policy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner,repo} = context.repo;
            const sha = process.env.RELEASE_COMMIT;
            const tag = 'v0.5.96';
            const notes = fs.readFileSync('docs/releases/v0.5.96.md','utf8');
            const main = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if (main !== context.sha) throw Error('Main moved during qualification');
            const pr = (await github.rest.pulls.get({owner,repo,pull_number:316})).data;
            if (pr.state !== 'open' || !pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'feat/rounded-physical-circuit-plan-20261107' ||
                pr.head.repo?.full_name !== 'sanskarIN/latebrake' ||
                pr.head.user?.login !== 'sanskarIN' || pr.head.sha !== sha) {
              throw Error('Candidate draft moved or ownership changed before publish');
            }
            const source = (await github.rest.repos.getContent({
              owner,repo,path:'docs/releases/v0.5.96.md',ref:sha
            })).data;
            if (source.encoding !== 'base64' ||
                !Buffer.from(source.content,'base64').equals(Buffer.from(notes,'utf8'))) {
              throw Error('Candidate notes bytes drifted from protected main');
            }
            const prev = (await github.rest.repos.getReleaseByTag({
              owner,repo,tag:'v0.5.95'
            })).data;
            if (prev.draft || !prev.prerelease || prev.assets.length !== 0) {
              throw Error('Previous source-only pre-release unexpectedly changed');
            }
            let ref;
            try {
              ref = (await github.rest.git.getRef({owner,repo,ref:'tags/'+tag})).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref) {
              if (ref.type !== 'commit' || ref.sha !== sha)
                throw Error('Refuse to overwrite or move an immutable release tag');
            } else {
              await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+tag,sha});
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner,repo,tag_name:tag,target_commitish:sha,
                name:'LateBrake v0.5.96 — World-Scale Rounded Circuit (SOURCE-ONLY Pre-release)',
                body:notes,draft:false,prerelease:true,
                generate_release_notes:false,make_latest:'false'
              })).data;
            }
            if (release.draft || !release.prerelease || release.tag_name !== tag ||
                release.target_commitish !== sha || release.body !== notes ||
                release.assets.length !== 0) {
              throw Error('Published v0.5.96 identity, source-only label or zero-assets gate failed');
            }
            core.notice('Published immutable v0.5.96 SOURCE-ONLY at '+release.html_url+' SHA='+sha);
