name: Publish v0.4.0 circuit-environment source pre-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.4.0-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latebrake-v0.4.0-source-preview
  cancel-in-progress: false

jobs:
  tests:
    name: Test portable C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++20 tests
        run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - name: Compile source tests
        run: cmake --build Tests/Standalone/build --config Release --parallel
      - name: Execute all portable racing and track tests
        run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure

  publish:
    name: Publish clearly labeled SOURCE-ONLY pre-release
    needs: [tests]
    if: github.repository == 'sanskarIN/latebrake' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish source revision as v0.4.0 pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = 'v0.4.0';
            const sha = context.sha;
            const expectedParent = 'v0.3.2';
            await github.rest.repos.getReleaseByTag({owner, repo, tag: expectedParent});
            const notes = [
              '## Latebrake v0.4.0 — Circuit & Environment source-only pre-release',
              '',
              '**This is NOT a tested playable game. No Win64 EXE, Android APK/AAB or Linux game binary is attached.**',
              'GitHub ZIP/tar source archives are uncompiled Unreal Engine source. No licensed UE 5.8 Editor/UHT/game target build, map cooking, in-game driving, or hardware/Android packaging test was performed.',
              '',
              '### Source additions',
              '- Unified player, checkpoint and experimental rival AI course coordinates, direction and recovery poses.',
              '- Non-colliding primitive lane markings, alternating red/white kerbs, two grandstands and a start/finish banner on the original starter circuit.',
              '- North-up desktop course minimap with player marker and next-gate highlight; compact/mobile HUD omits the map.',
              '- Portable C++20 tests for geometry consistency, nonblocking decoration placement plans, bounds and minimap projections.',
              '',
              '### Build and gameplay caveats',
              '- This is still ONE prototype course and not a set of independently selectable tracks.',
              '- Separate static-mesh actors for decorations are provisional and need profiling/instancing for mobile.',
              '- The release workflow gates the exact source revision on Ubuntu/Windows/macOS standalone CMake/CTest suites; it cannot validate Unreal Engine runtime classes or visual rendering.',
              '- Full Unreal compilation, Win64/Android cooked packages, original finished assets and hardware gameplay QA are required before stable v1.0.0.',
              '',
              'Course/QA documentation: docs/TRACK.md and docs/releases/v0.4.0.md.',
              'Remaining qualification: https://github.com/sanskarIN/latebrake/issues/2',
              'Authored source BSD-3-Clause; Unreal Engine is separately licensed.'
            ].join('\n');

            let tagRef;
            try {
              const existingTag = await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag});
              tagRef = existingTag.data.object;
              if (tagRef.type !== 'commit' || tagRef.sha !== sha) {
                throw new Error('Tag already exists at a different revision: refusing to retag.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha});
              core.info('Created ' + tag + ' at ' + sha);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: sha,
                name: 'Latebrake v0.4.0 — Circuit & Environment Expansion (Source Pre-release)',
                body: notes,
                draft: false,
                prerelease: true,
                make_latest: 'false',
                generate_release_notes: false
              })).data;
            }
            if (release.draft || !release.prerelease || release.tag_name !== tag) {
              throw new Error('v0.4.0 must be published as a non-draft source-only pre-release.');
            }
            core.notice('Published/verified: ' + release.html_url + ' @ ' + sha);
