name: Publish approved v0.5.100 SOURCE-ONLY (exact SHA, NO game)

# Manual only. Does NOT certify Unreal, ship an executable, or attach assets.
# No push/release/PR trigger, and no write token until all exact-source jobs pass.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-lowercase-hex reviewed protected-main SHA'
        type: string
        required: true
      approval:
        description: 'Type: I approve v0.5.100 SOURCE-ONLY at <exact SHA>'
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: latebrake-v05100-exact-sha-source-publisher
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact-main owner approval, source release guard (NO writes)
    if: >-
      github.repository == 'sanskarIN/latebrake' &&
      github.actor == 'sanskarIN' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm exact source and test all release guard transitions
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test Tests/Release/SourceReleaseV05100ReadinessTests.cjs Tests/Release/SourceReleaseV05100PublishTests.cjs
      - name: Enforce owner typed SHA approval and independent source audit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const guard = require('./scripts/SourceReleaseV05100Readiness.cjs');
            const publisher = require('./scripts/PublishSourceV05100.cjs');
            const exact = publisher.requireExactAuthorization(context);
            const notes = fs.readFileSync(guard.NOTES_PATH,'utf8');
            const result = await guard.inspectReadiness({
              github,context,candidateSha:exact,notes,
            });
            core.notice('SOURCE-ONLY v0.5.100 read-only gate passed for '+result.candidateSha);

  cpp:
    name: Publisher strict portable C++20 / ${{ matrix.os }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: cmake -S Tests/Standalone -B Tests/Standalone/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build Tests/Standalone/build --config Release --parallel 4
      - run: ctest --test-dir Tests/Standalone/build -C Release --output-on-failure
      - name: Require drafting actual source target
        shell: bash
        run: ctest --test-dir Tests/Standalone/build -C Release -R '^SlipstreamDraftBoost$' --no-tests=error --output-on-failure

  editor:
    name: Publisher Python and source scale (NOT Unreal)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python3 -m py_compile scripts/Unreal/CreateStarterMap.py
      - run: python3 -m unittest discover -s Tests/Editor -p '*Tests.py' -v
      - run: python3 scripts/MeasureSourceScale.py --json

  policies:
    name: Publisher PowerShell policy (NO engine)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source identity and policy tests
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {
            throw 'Source SHA changed before synthetic packaging tests'
          }
          foreach ($script in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File)) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw "Invalid PowerShell: $($script.Name)" }
          }
          & ./scripts/Test-PackagingPolicy.ps1
          if (-not $?) { throw 'Synthetic package policy failed' }
          & ./scripts/Test-SourceProvenancePolicy.ps1
          if (-not $?) { throw 'Source provenance policy failed' }
          & ./scripts/Test-WindowsRuntimePlaytestPolicy.ps1
          if (-not $?) { throw 'Synthetic runtime policy failed' }

  docs:
    name: Publisher exact-source docs build
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python -m pip install --requirement docs-requirements.txt
      - run: python -m mkdocs build --clean
      - run: python scripts/verify_docs_site.py site

  publish:
    name: Publish exact-main v0.5.100 SOURCE-ONLY (zero attachments)
    needs: [preflight, cpp, editor, policies, docs]
    if: >-
      github.repository == 'sanskarIN/latebrake' &&
      github.actor == 'sanskarIN' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
    steps:
      # Execute ONLY reviewed, protected main source with a write token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate and publish one source-only tag and release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const guard = require('./scripts/SourceReleaseV05100Readiness.cjs');
            const publisher = require('./scripts/PublishSourceV05100.cjs');
            const notes = fs.readFileSync(guard.NOTES_PATH, 'utf8');
            const release = await publisher.publish({github,context,notes});
            core.notice('Source-only readback verified: '+release.html_url+' @ '+context.sha+
              ', ZERO game/executable attachments. NOT a playable Windows game.');
