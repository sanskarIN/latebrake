name: Documentation website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'scripts/verify_docs_site.py'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'scripts/verify_docs_site.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs-build:
    name: Build and verify docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - name: Install pinned docs dependencies
        run: python -m pip install --requirement docs-requirements.txt
      - name: Render original Markdown documentation
        run: python -m mkdocs build --clean
      - name: Verify site structure, status and navigation
        run: python scripts/verify_docs_site.py site
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload documentation-only Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy official Pages documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation artifact
        id: deployment
        uses: actions/deploy-pages@v4
