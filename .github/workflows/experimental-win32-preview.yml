name: Experimental LateBrake V5 Win64 preview (NOT Unreal)

on:
  pull_request:
    paths:
      - 'Experiments/Win32Preview/**'
      - '.github/workflows/experimental-win32-preview.yml'
  push:
    branches: [main]
    paths:
      - 'Experiments/Win32Preview/**'
      - '.github/workflows/experimental-win32-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-win32-preview:
    name: Build native V5 Win64 / run synthetic self-test (NO UE)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build true PE32+ game and embedded setup, not Unreal
        shell: pwsh
        run: |
          ./Experiments/Win32Preview/Build-Windows.ps1
      - name: Run synthetic C++ navigation/progression smoke test
        shell: pwsh
        run: |
          # GUI-subsystem EXEs can return control to PowerShell without
          # populating LASTEXITCODE; wait for the actual process handle.
          $exe = (Resolve-Path './Experiments/Win32Preview/out/LateBrakePreviewV5.exe').Path
          $run = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Preview self-test failed: $($run.ExitCode)" }
      - name: Prove synthetic self-test does not modify user career data
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'latebrake-v5-isolated-profile'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          $env:LOCALAPPDATA = $isolated
          $exe = (Resolve-Path './Experiments/Win32Preview/out/LateBrakePreviewV5.exe').Path
          $run = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw 'Isolated progression test failed.' }
          $files = @(Get-ChildItem -LiteralPath $isolated -Recurse -File)
          if ($files.Count -ne 0) { throw 'A self-test wrote to an isolated player profile.' }
      - name: Verify PE architecture and embedded payload identity
        shell: pwsh
        run: |
          python ./Experiments/Win32Preview/VerifyPayload.py `
            ./Experiments/Win32Preview/out/LateBrakePreviewV5.exe `
            ./Experiments/Win32Preview/out/LateBrakeSetupV5.exe `
            ./Experiments/Win32Preview/out/payload.inc
      - name: Test setup argument parsing without installing anything
        shell: pwsh
        run: |
          # The actual Win64 setup runs its own headless argument fixtures.
          # A test must never touch a real player's LOCALAPPDATA.
          $isolated = Join-Path $env:RUNNER_TEMP 'latebrake-v5-setup-parser-test'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          $env:LOCALAPPDATA = $isolated
          $setup = (Resolve-Path './Experiments/Win32Preview/out/LateBrakeSetupV5.exe').Path
          $run = Start-Process -FilePath $setup -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Setup command parser self-test failed: $($run.ExitCode)" }
          $files = @(Get-ChildItem -LiteralPath $isolated -Recurse -File)
          if ($files.Count -ne 0) { throw 'A setup self-test wrote to player storage.' }
      - name: Write exact source and SHA-256 trial receipt
        shell: pwsh
        env:
          SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          $out = (Resolve-Path './Experiments/Win32Preview/out').Path
          $game = Join-Path $out 'LateBrakePreviewV5.exe'
          $setup = Join-Path $out 'LateBrakeSetupV5.exe'
          foreach ($candidate in @($game, $setup)) {
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Missing actual compiled trial executable: $candidate"
            }
          }
          $gameHash = (Get-FileHash -LiteralPath $game -Algorithm SHA256).Hash
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          $receipt = @(
            'LateBrake V5 UNVERIFIED 2D Win64 trial — NOT the Unreal Engine 3D game'
            "Source PR head: $env:SOURCE_PR_HEAD"
            "Actions checkout SHA (may be a synthetic PR merge): $env:CHECKOUT_SHA"
            "LateBrakePreviewV5.exe SHA256: $gameHash"
            "LateBrakeSetupV5.exe SHA256: $setupHash"
            'Windows MSVC x64 compile and isolated --self-test passed in this workflow.'
            'No real UE 5.8 build, cook, 3D rendering, controller hardware or installed QA.'
            'Do not treat this artifact as a stable release or override Windows security warnings.'
          )
          $receipt | Set-Content -LiteralPath (Join-Path $out 'TRIAL_BUILD_SHA256.txt') -Encoding utf8
          Write-Host 'Source-bound 2D Win64 trial receipt staged.'
      - name: Archive experimental UNVERIFIED installer for private GUI QA
        uses: actions/upload-artifact@v5
        with:
          name: UNVERIFIED-LateBrake-V5-2D-Win64-${{ github.sha }}
          path: |
            Experiments/Win32Preview/out/LateBrakePreviewV5.exe
            Experiments/Win32Preview/out/LateBrakeSetupV5.exe
            Experiments/Win32Preview/out/TRIAL_BUILD_SHA256.txt
            Experiments/Win32Preview/TRIAL_QUICKSTART.md
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
